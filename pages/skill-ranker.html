<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>傷害計算與排序</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, "PingFang TC", "Microsoft JhengHei", sans-serif;
    max-width: 900px;
    margin: 30px auto;
    padding: 0 16px 60px;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-bottom: 8px; }
  .card {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
    margin-bottom: 20px;
  }
  .range-grid {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr;
    gap: 10px 8px;
    align-items: center;
    max-width: 520px;
  }
  label { font-size: 14px; white-space: nowrap; }
  input {
    width: 100%;
    padding: 8px 10px;
    font-size: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  input:focus { outline: 2px solid #0071e3; border-color: #0071e3; }
  input.invalid { border-color: #d00; background: #fff5f5; }
  .field-msg { color: #d00; font-size: 12px; margin-top: 3px; min-height: 14px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; text-align: left; font-size: 14px; }
  th { color: #666; font-weight: 600; border-bottom: 1px solid #e0e0e0; }
  .item-row td { padding: 6px 4px; }
  .name-cell { width: 30%; }
  .del-btn {
    background: #ffe5e5; color: #d00; border: none;
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px;
  }
  .del-btn:hover { background: #ffd0d0; }
  .add-btn {
    margin-top: 12px; background: #eef6ff; color: #0071e3; border: 1px dashed #0071e3;
    border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px;
  }
  .add-btn:hover { background: #dceeff; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  select { padding: 8px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 8px; }
  .result-table th, .result-table td { border-bottom: 1px solid #eee; }
  .rank { font-weight: 700; color: #0071e3; width: 40px; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .err { color: #d00; }
  .dup-name { color: #d00; font-weight: 700; }
  .unnamed { color: #0a6b3d; font-style: italic; }
  .err-name { text-decoration: line-through; font-weight: 700; font-style: italic; color: #999; }
  .hint { color: #888; font-size: 13px; margin-top: 6px; line-height: 1.6; }
  code { background: #f0f0f0; padding: 1px 5px; border-radius: 4px; }
  .note-line { margin: 0; font-size: 14px; color: #444; }
  .note-line strong { font-weight: 700; }
  .first-card-inner { display: flex; gap: 20px; align-items: stretch; }
  .first-card-left {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }
  /* 標題固定在上方(與其他區塊標題位置一致),不參與分配 */
  .first-card-left > h2 { margin: 0 0 8px; }
  /* 標題以下的內容,在剩餘空間內間距平均分佈 */
  .left-body {
    flex: 1;
    display: flex; flex-direction: column; justify-content: space-evenly;
  }
  .left-body > .range-block { margin: 0; }
  #sideImg {
    width: 320px; max-width: 40%;
    height: auto; object-fit: contain;
    border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12);
    flex-shrink: 0;
    align-self: flex-start; /* 圖片維持原比例,不被拉伸 */
  }
  /* 視窗較窄時改成上下排列,圖片放到滿寬 */
  @media (max-width: 700px) {
    .first-card-inner { flex-direction: column; }
    #sideImg { width: 100%; max-width: 100%; }
  }
</style>
</head>
<body>

<h1>傷害計算與排序</h1>

<div class="card">
  <div class="first-card-inner">
    <div class="first-card-left">

    <label>b 最大</label><input type="number" id="bMax" value="0" step="any">

<div class="card">
  <h2>2. 輸入項目(名稱 + 公式)</h2>
  <table>
    <thead>
      <tr><th class="name-cell">名稱</th><th>公式</th><th></th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <button class="add-btn" onclick="addRow()">＋ 新增一列</button>
  <div class="hint">
    公式可用變數 <code>a</code>、<code>b</code>,支援 <code>+</code>、<code>*</code>、括號 <code>( )</code> 與次方 <code>^</code>(不支援 <code>-</code> 與 <code>/</code>)。<br>
    支援省略乘號寫法,例如 <code>0.2a</code>、<code>2(a+b)</code>、<code>(92.0)*a</code> 都可以。<br>
    範例:<code>8.9*1.0+b+(92.0)*a+0.2a</code>
  </div>
</div>

<div class="card">
  <h2>3. 計算並排序</h2>
  <div class="toolbar">
    <label>排序依據
      <select id="sortBy">
        <option value="max">最大值</option>
        <option value="avg" selected>平均值</option>
        <option value="min">最小值</option>
      </select>
    </label>
    <label>排序方向
      <select id="sortDir">
        <option value="desc" selected>由大到小</option>
        <option value="asc">由小到大</option>
      </select>
    </label>
  </div>
  <div id="result" style="margin-top:16px;"></div>
</div>

<script>
  // ---- 動態列 ----
  function addRow(name = '', formula = '') {
    const tbody = document.getElementById('rows');
    const tr = document.createElement('tr');
    tr.className = 'item-row';
    tr.innerHTML = `
      <td class="name-cell"><input type="text" class="in-name" placeholder="名稱" value="${escapeAttr(name)}"><div class="field-msg"></div></td>
      <td><input type="text" class="in-formula" placeholder="例如 0.2*a+b+1350" value="${escapeAttr(formula)}"><div class="field-msg"></div></td>
      <td><button class="del-btn" onclick="this.closest('tr').remove(); validateNames(); calcAll();">刪除</button></td>`;
    tbody.appendChild(tr);
  }
  function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

  // 初始一列(帶入範例,方便測試;可自行清空)
  addRow('8級鮮紅天罡', '1.1*a+b+2700+1.2*b');

  // 檢查名稱是否重複,重複就把相關的名稱框變紅並提示
  function validateNames() {
    const inputs = [...document.querySelectorAll('#rows .in-name')];
    const counts = {};
    inputs.forEach(inp => {
      const v = inp.value.trim();
      if (v) counts[v] = (counts[v] || 0) + 1;
    });
    inputs.forEach(inp => {
      const v = inp.value.trim();
      const msg = inp.parentElement.querySelector('.field-msg');
      if (v && counts[v] > 1) { inp.classList.add('invalid'); msg.textContent = '已有相同名稱'; }
      else { inp.classList.remove('invalid'); msg.textContent = ''; }
    });
  }

  // 打字時即時檢查公式,不合法就把框變紅並顯示原因;並即時重算
  document.getElementById('rows').addEventListener('input', (e) => {
    if (e.target.classList.contains('in-formula')) {
      const input = e.target;
      const msg = input.parentElement.querySelector('.field-msg');
      const val = input.value.trim();
      if (val === '') { input.classList.remove('invalid'); msg.textContent = ''; }
      else {
        const m = makeFn(val);
        if (m.error) { input.classList.add('invalid'); msg.textContent = m.error; }
        else { input.classList.remove('invalid'); msg.textContent = ''; }
      }
    }
    if (e.target.classList.contains('in-name')) validateNames();
    calcAll(); // 名稱或公式改動 → 即時重算
  });

  // ---- a、b 區間驗證 ----
  // 規則:最小值不能是負數;最大值不能小於最小值
  function validateRanges() {
    const g = id => Number(document.getElementById(id).value);
    const errors = [];
    [['a', 'aMin', 'aMax'], ['b', 'bMin', 'bMax']].forEach(([label, minId, maxId]) => {
      const min = g(minId), max = g(maxId);
      if (min < 0) errors.push(`${label} 最小值不能是負數`);
      if (max < min) errors.push(`${label} 最大值不能小於最小值`);
    });
    // 標紅出錯的欄位
    const aMin = g('aMin'), aMax = g('aMax'), bMin = g('bMin'), bMax = g('bMax');
    mark('aMin', aMin < 0);
    mark('bMin', bMin < 0);
    mark('aMax', aMax < aMin);
    mark('bMax', bMax < bMin);
    const msg = document.getElementById('rangeMsg');
    msg.textContent = errors.join(';');
    return errors;
  }
  function mark(id, bad) {
    document.getElementById(id).classList.toggle('invalid', bad);
  }
  ['aMin', 'aMax', 'bMin', 'bMax'].forEach(id =>
    document.getElementById(id).addEventListener('input', () => { validateRanges(); calcAll(); }));
  // 排序選項改動 → 即時重排
  ['sortBy', 'sortDir'].forEach(id =>
    document.getElementById(id).addEventListener('change', calcAll));

  // ---- 公式處理:補上省略的乘號 ----
  function normalize(expr) {
    let s = expr.replace(/\s+/g, '');
    s = s.replace(/\^/g, '**');
    // 數字 / ) / 變數 後面接 變數 或 (  → 補 *
    s = s.replace(/([0-9\).ab])(?=[a-b(])/g, '$1*');
    // 變數 後面接 數字  → 補 *(例如 a2)
    s = s.replace(/([ab])(?=[0-9])/g, '$1*');
    return s;
  }

  // 建立公式函式;回傳 { fn } 或 { error }
  function makeFn(expr) {
    const s = normalize(expr);
    // 數字不可以 0 開頭(避免把手誤的 00.092 當成 0.092 靜默算錯)
    if (/(?<![\d.])0[0-9]/.test(s)) {
      return { error: '數字不可 0 開頭(例如 00.092,是否想打 100.092?)' };
    }
    // 只允許安全字元(a、b、數字、+ * ( ) . );不允許 - 與 /
    if (!/^[0-9a-b+*().]*$/.test(s)) {
      const bad = [...new Set(s.replace(/[0-9a-b+*().]/g, '').split(''))].join(' ');
      return { error: `含不支援的字元:${bad}(只能用 a、b、數字與 + * ( )` + '）' };
    }
    try {
      const fn = new Function('a', 'b', 'return (' + s + ');');
      // 試算一次確認可執行
      const t = fn(1, 1);
      if (typeof t !== 'number') return { error: '公式錯誤' };
      return { fn };
    } catch (e) { return { error: '公式錯誤' }; }
  }

  // 在 a、b 區間上取樣,求最小/最大/平均
  function evalRange(fn, aMin, aMax, bMin, bMax) {
    const steps = 40;
    let min = Infinity, max = -Infinity, sum = 0, count = 0;
    const aN = (aMax === aMin) ? 1 : steps;
    const bN = (bMax === bMin) ? 1 : steps;
    for (let i = 0; i <= aN; i++) {
      const a = aN === 1 ? aMin : aMin + (aMax - aMin) * i / aN;
      for (let j = 0; j <= bN; j++) {
        const b = bN === 1 ? bMin : bMin + (bMax - bMin) * j / bN;
        const v = fn(a, b);
        if (Number.isFinite(v)) {
          if (v < min) min = v;
          if (v > max) max = v;
          sum += v; count++;
        }
      }
    }
    if (count === 0) return null;
    return { min, max, avg: sum / count };
  }

  function fmt(n) {
    return Number(n.toFixed(4)).toLocaleString('en-US', { maximumFractionDigits: 4 });
  }

  // ---- 主計算 ----
  function calcAll() {
    const rangeErrors = validateRanges();
    if (rangeErrors.length > 0) {
      document.getElementById('result').innerHTML =
        '<p class="err">請先修正 a、b 區間的問題:' + rangeErrors.join(';') + '</p>';
      return;
    }
    const aMin = Number(document.getElementById('aMin').value);
    const aMax = Number(document.getElementById('aMax').value);
    const bMin = Number(document.getElementById('bMin').value);
    const bMax = Number(document.getElementById('bMax').value);
    const lo_a = aMin, hi_a = aMax;
    const lo_b = bMin, hi_b = bMax;

    const rows = [...document.querySelectorAll('#rows tr')];
    const results = [];
    for (const tr of rows) {
      const name = tr.querySelector('.in-name').value.trim() || '(未命名)';
      const formula = tr.querySelector('.in-formula').value.trim();
      if (!formula) continue;
      const m = makeFn(formula);
      if (m.error) { results.push({ name, formula, error: m.error }); continue; }
      const r = evalRange(m.fn, lo_a, hi_a, lo_b, hi_b);
      if (!r) { results.push({ name, formula, error: '無有效數值' }); continue; }
      results.push({ name, formula, ...r });
    }

    // 排序
    const by = document.getElementById('sortBy').value;   // min / avg / max
    const dir = document.getElementById('sortDir').value; // asc / desc
    const valid = results.filter(r => !r.error);
    const invalid = results.filter(r => r.error);
    valid.sort((x, y) => dir === 'desc' ? y[by] - x[by] : x[by] - y[by]);

    render(valid, invalid, aMin === aMax && bMin === bMax);
  }

  function render(valid, invalid, singlePoint) {
    const el = document.getElementById('result');
    if (valid.length === 0 && invalid.length === 0) {
      el.innerHTML = '<p class="hint">請先輸入至少一個項目的公式。</p>';
      return;
    }
    // 統計名稱出現次數,重複的以紅色粗體標示
    const nameCounts = {};
    valid.concat(invalid).forEach(r => { nameCounts[r.name] = (nameCounts[r.name] || 0) + 1; });
    const nameCell = name => {
      if (name === '(未命名)') return `<span class="unnamed">${escapeHtml(name)}</span>`; // 未命名 → 斜體深綠,不判斷重複
      if (nameCounts[name] > 1) return `<span class="dup-name">${escapeHtml(name)}(已重複)</span>`; // 真正重複 → 紅色粗體
      return escapeHtml(name);
    };

    let html = '<table class="result-table"><thead><tr>' +
      '<th>排名</th><th>名稱</th><th>公式</th>' +
      '<th class="num">最小值</th><th class="num">平均值</th><th class="num">最大值</th>' +
      '</tr></thead><tbody>';
    valid.forEach((r, i) => {
      html += `<tr>
        <td class="rank">${i + 1}</td>
        <td>${nameCell(r.name)}</td>
        <td><code>${escapeHtml(r.formula)}</code></td>
        <td class="num">${fmt(r.min)}</td>
        <td class="num">${fmt(r.avg)}</td>
        <td class="num">${fmt(r.max)}</td>
      </tr>`;
    });
    invalid.forEach(r => {
      html += `<tr>
        <td class="rank">-</td>
        <td><span class="err-name">${escapeHtml(r.name)}</span></td>
        <td><code>${escapeHtml(r.formula)}</code></td>
        <td class="num err" colspan="3">${r.error}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    if (singlePoint) html += '<p class="hint">a、b 皆為單一值,故最小=平均=最大。</p>';
    else html += '<p class="hint">因 a、b 為區間,各項目顯示其可能的數值範圍;排名依上方所選基準。</p>';
    el.innerHTML = html;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  // 載入時先算一次
  calcAll();
</script>
</body>
</html>
